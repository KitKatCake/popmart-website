name: Trivy Security Scan & Auto Repair

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  security-events: write
  packages: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: popmart-web
  IMAGE_TAG: latest
  PATCHED_TAG: latest-patched

jobs:
  trivy-scan-and-repair:
    name: Security Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      ##########################################################
      # Build Docker Image
      ##########################################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 💡 确保使用官方标准的 build-push-action，并开启 load: true 导出到本地
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify image exists
        run: |
          docker images
          docker inspect ${IMAGE_NAME}:${IMAGE_TAG}

      ##########################################################
      # Trivy SARIF Scan
      ##########################################################

      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      ##########################################################
      # Generate JSON Report For Copa
      ##########################################################

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      - name: Verify Report
        run: |
          ls -lh
          test -f trivy-report.json

      ##########################################################
      # Run Copa Patch（💡 已修复：移除了导致隔离报错的 buildkit-version）
      ##########################################################
      - name: Patch Image Using Copa
        uses: project-copacetic/copa-action@v1
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          image-report: trivy-report.json
          patched-tag: ${{ env.PATCHED_TAG }}
          copa-version: 0.8.0

      ##########################################################
      # Verify Patched Image
      ##########################################################

      - name: Verify Patched Image
        run: |
          docker images
          docker inspect ${IMAGE_NAME}:${PATCHED_TAG}

      ##########################################################
      # Re-Scan Patched Image
      ##########################################################

      - name: Re-Scan Patched Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}'
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # Harbor Login
      ##########################################################

      - name: Login Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      ##########################################################
      # Push Patched Image
      ##########################################################

      - name: Push Patched Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag \
            ${IMAGE_NAME}:${PATCHED_TAG} \
            ${{ env.REGISTRY }}/public/webdev:${PATCHED_TAG}
          docker push \
            ${{ env.REGISTRY }}/public/webdev:${PATCHED_TAG}

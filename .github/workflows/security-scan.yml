name: Trivy Security Scan & Auto Repair

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  security-events: write
  packages: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: popmart-web
  IMAGE_TAG: latest
  PATCHED_TAG: latest-patched

jobs:
  trivy-scan-and-repair:
    name: Security Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      ##########################################################
      # 1. 初始化并构建本地 Docker 镜像
      ##########################################################
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 使用 load: true 将构建好的本地镜像直接加载回当前宿主机的 Docker Daemon 中
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify image exists
        run: |
          docker images
          docker inspect ${IMAGE_NAME}:${IMAGE_TAG}

      ##########################################################
      # 2. 运行 Trivy 漏洞扫描（双格式输出）
      ##########################################################
      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # 3. 宿主机就地运行 Copa 修复镜像（已更换为安全的标准化安装组件）
      ##########################################################
      # 使用 GitHub 官方推荐的标准化工具下载组件，安全获取指定版本的 copa 二进制文件
      - name: Install Copa CLI
        uses: jasonruesch/action-install@v1
        with:
          url: https://github.com
          name: copa
          bin: copa

      # 强制利用宿主机原生 Docker 存储驱动进行就地修复，彻底绕过远程仓库
      - name: Patch Image Locally
        run: |
          copa patch \
            -i ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -r trivy-report.json \
            -t ${{ env.PATCHED_TAG }} \
            --image-store local

      ##########################################################
      # 4. 对修补后的最终镜像执行二次验证扫描
      ##########################################################
      - name: Verify Patched Image
        run: |
          docker images
          docker inspect ${IMAGE_NAME}:${PATCHED_TAG}

      - name: Re-Scan Patched Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}'
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # 5. 推送修补完好、验证通过的镜像至私有 Harbor 仓库
      ##########################################################
      - name: Login Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push Patched Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }} \
            ${{ env.REGISTRY }}/public/webdev:${{ env.PATCHED_TAG }}
          docker push \
            ${{ env.REGISTRY }}/public/webdev:${{ env.PATCHED_TAG }}

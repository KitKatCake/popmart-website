name: Trivy Security Scan & Auto Repair

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: popmart-web
  IMAGE_TAG: latest
  PATCHED_TAG: latest-patched
  DOCKER_BUILDKIT: 1

jobs:
  trivy-scan-and-repair:
    runs-on: ubuntu-latest

    steps:
      # -----------------------
      # 1. Checkout
      # -----------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------
      # 2. Docker Buildx
      # -----------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify image exists
        run: |
          docker images
          docker inspect ${IMAGE_NAME}:${IMAGE_TAG}

      # -----------------------
      # 3. Trivy Scan
      # -----------------------
      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      # -----------------------
      # 4. Install Copa CLI
      # -----------------------
      - name: Install Copa CLI
        run: |
          set -e
          COPA_VERSION="0.14.0"

          curl -L -o /tmp/copa.tar.gz \
            https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}/copa_${COPA_VERSION}_linux_amd64.tar.gz

          file /tmp/copa.tar.gz

          tar -xzf /tmp/copa.tar.gz -C /tmp

          chmod +x /tmp/copa
          sudo mv /tmp/copa /usr/local/bin/copa

          which copa
          copa version

      # -----------------------
      # 5. Patch image (容错)
      # -----------------------
      - name: Patch Image Locally
        continue-on-error: true
        run: |
          echo "Start patching image..."
          copa patch \
            -i ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -r trivy-report.json \
            -t ${{ env.PATCHED_TAG }} \
            --image-store local || echo "Patch failed, continue CI"

      # -----------------------
      # 6. Verify patched image
      # -----------------------
      - name: Verify Patched Image
        run: |
          docker images
          docker inspect ${IMAGE_NAME}:${PATCHED_TAG} || echo "Patched image not found, skipping"

      # -----------------------
      # 7. Re-Scan patched image
      # -----------------------
      - name: Re-Scan Patched Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}"
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH
        continue-on-error: true

      # -----------------------
      # 8. Login Harbor
      # -----------------------
      - name: Login Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # -----------------------
      # 9. Push final image
      # -----------------------
      - name: Push Patched Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || echo "Tag failed, skipping push"

          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || echo "Push failed, skipping"

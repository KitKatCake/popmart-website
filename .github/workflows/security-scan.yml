name: Trivy Security Scan & Auto Repair
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: popmart-web
  IMAGE_TAG: latest
  PATCHED_TAG: latest-patched
  DOCKER_BUILDKIT: 1

jobs:
  trivy-scan-and-repair:
    runs-on: ubuntu-latest
    steps:
      # -----------------------
      # 1. Checkout
      # -----------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------
      # 2. Docker Buildx and build local image
      # -----------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify image exists
        run: |
          docker images
          docker inspect ${IMAGE_NAME}:${IMAGE_TAG}

      # -----------------------
      # 3. Trivy Scan (SARIF + JSON)
      # -----------------------
      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      # -----------------------
      # 4. Login Harbor (提前登录，后续推送用)
      # -----------------------
      - name: Login Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # -----------------------
      # 5. Push original image to Harbor (Copa 需要从 registry 拉取基础层)
      # -----------------------
      - name: Push original image to Harbor
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # -----------------------
      # 6. Install Copa CLI
      # -----------------------
      - name: Install Copa CLI
        run: |
          set -eux
          COPA_VERSION="0.14.0"
          curl -L -o /tmp/copa.tar.gz \
            https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}/copa_${COPA_VERSION}_linux_amd64.tar.gz
          tar -xzf /tmp/copa.tar.gz -C /tmp
          chmod +x /tmp/copa
          sudo mv /tmp/copa /usr/local/bin/copa
          copa --help

      # -----------------------
      # 7. Patch Image using Copa (使用 Harbor 完整地址)
      # -----------------------
      - name: Patch Image with Copa
        id: patch
        if: github.event_name != 'pull_request'
        run: |
          set +e
          copa patch \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --report trivy-report.json \
            --tag ${{ env.PATCHED_TAG }}
          exit_code=$?
          set -e
          if [ $exit_code -eq 0 ]; then
            echo "patch_applied=true" >> $GITHUB_OUTPUT
          elif [ $exit_code -eq 2 ] && copa 2>&1 | grep -q "no package updates found"; then
            echo "No vulnerabilities to patch – skipping remaining steps"
            echo "patch_applied=false" >> $GITHUB_OUTPUT
          else
            echo "Copa failed with error code $exit_code"
            exit $exit_code
          fi

      # -----------------------
      # 8. Verify patched image (only if patch was applied)
      # -----------------------
      - name: Verify Patched Image
        if: steps.patch.outputs.patch_applied == 'true'
        run: |
          docker images | grep ${{ env.PATCHED_TAG }} || \
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}

      # -----------------------
      # 9. Re-scan patched image
      # -----------------------
      - name: Re-Scan Patched Image
        if: steps.patch.outputs.patch_applied == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}"
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH

      # -----------------------
      # 10. (可选) 如果 Copa 没有自动推送，手动推送 patched 镜像
      # 注：Copa v0.14 会在打补丁后自动将新镜像推送到原始 registry，
      # 所以通常不需要手动 push，但保留这一步以确保安全。
      # -----------------------
      - name: Push Patched Image (if not auto-pushed)
        if: steps.patch.outputs.patch_applied == 'true'
        run: |
          # 检查新镜像是否已经存在于 Harbor；若没有则手动推送
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }} || echo "Image already pushed by Copa"

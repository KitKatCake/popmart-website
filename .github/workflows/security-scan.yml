name: Trivy Security Scan & Auto Repair

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write
  security-events: write
  packages: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: public/popmart-website
  IMAGE_TAG: dev
  PATCHED_TAG: dev-patched
  COPA_VERSION: "0.14.1"

jobs:
  trivy-scan-and-repair:
    name: Security Workflow
    runs-on: ubuntu-latest

    steps:
      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout Source
        uses: actions/checkout@v4

      ####################################################################
      # Harbor Login
      ####################################################################

      - name: Login Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      ####################################################################
      # Docker Build
      ####################################################################

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify Built Image
        run: |
          set -euxo pipefail

          docker images

          docker inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      ####################################################################
      # Snyk
      ####################################################################

      - name: Install Snyk CLI
        run: |
          npm install -g snyk

      - name: Snyk Dependency Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --severity-threshold=high \
            --all-projects \
            --json-file-output=snyk-deps.json
        continue-on-error: true

      - name: Snyk Code Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test \
            --severity-threshold=high \
            --json-file-output=snyk-code.json
        continue-on-error: true

      - name: Snyk Auto Fix
        if: github.event_name != 'pull_request'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euxo pipefail

          snyk fix --yes || true

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add .

            git commit -m "chore: apply Snyk auto-fixes [skip ci]"

            git push
          else
            echo "No auto-fixable changes detected."
          fi
        continue-on-error: true

      - name: Snyk Monitor
        if: github.event_name != 'pull_request'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk monitor --all-projects
        continue-on-error: true

      ####################################################################
      # Trivy SARIF
      ####################################################################

      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      ####################################################################
      # Trivy JSON For Copa
      ####################################################################

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      - name: Verify Trivy Report
        run: |
          set -euxo pipefail

          ls -lh trivy-report.json

          jq '.Results | length' trivy-report.json || true

      ####################################################################
      # Install Copa
      ####################################################################

      - name: Install Copa CLI
        run: |
          set -euxo pipefail

          curl -L \
            -o /tmp/copa.tar.gz \
            "https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}/copa_${COPA_VERSION}_linux_amd64.tar.gz"

          tar -xzf /tmp/copa.tar.gz -C /tmp

          chmod +x /tmp/copa

          sudo mv /tmp/copa /usr/local/bin/copa

      - name: Verify Copa Installation
        run: |
          set -euxo pipefail

          which copa

      ####################################################################
      # Copa Patch
      ####################################################################

      - name: Patch Image With Copa
        run: |
          set -euxo pipefail

          copa patch \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            --report trivy-report.json \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}"

      ####################################################################
      # Verify Patched Image
      ####################################################################

      - name: Verify Patched Image
        run: |
          set -euxo pipefail

          docker images

          docker inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}"

      ####################################################################
      # Re-Scan Patched Image
      ####################################################################

      - name: Re-Scan Patched Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}"
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH

      ####################################################################
      # Push Patched Image
      ####################################################################

      - name: Push Patched Image To Harbor
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail

          docker push \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}"

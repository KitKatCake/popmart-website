name: Trivy Security Scan & Auto Repair

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  security-events: write
  packages: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  # 💡 修改点 1：把镜像全称和路径直接定义在 env 中，让所有工具链统一路径
  FULL_IMAGE_NAME: harbor.xingzhan.cloud:9443/public/webdev
  IMAGE_TAG: latest
  PATCHED_TAG: latest-patched

jobs:
  trivy-scan-and-repair:
    name: Security Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      ##########################################################
      # 1. 登录 Harbor（💡 挪到最前面，确保后续所有步骤均可正常拉取/推送）
      ##########################################################
      - name: Login Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      ##########################################################
      # 2. 启动并配置本地 Docker Buildx 环境
      ##########################################################
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 💡 修改点 2：使用带域名的全称构建，并同时 load（本地测试用）和 push（让隔离的 Copa 能够拉到）
      - name: Build and Push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      ##########################################################
      # 3. 运行 Trivy 扫描
      ##########################################################
      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # 4. 运行 Copa 修补（💡 传入带私有域名的完整镜像名称）
      ##########################################################
      - name: Patch Image Using Copa
        uses: project-copacetic/copa-action@v1
        with:
          image: ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          image-report: trivy-report.json
          patched-tag: ${{ env.PATCHED_TAG }}
          copa-version: 0.8.0
          timeout: 5m

      ##########################################################
      # 5. 校验并二次扫描修补后的镜像
      ##########################################################
      - name: Re-Scan Patched Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.FULL_IMAGE_NAME }}:${{ env.PATCHED_TAG }}'
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # 6. 推送修复后的成品镜像（💡 此时 Copa 已在本地生成了新 Tag，直接 Push）
      ##########################################################
      - name: Push Patched Image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.FULL_IMAGE_NAME }}:${{ env.PATCHED_TAG }}

name: Trivy Security Scan & Auto Repair

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  security-events: write
  packages: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: popmart-web
  IMAGE_TAG: latest
  PATCHED_TAG: latest-patched

jobs:
  trivy-scan-and-repair:
    name: Security Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      ##########################################################
      # Build Docker Image
      ##########################################################

      # 修复点 1：必须开启并配置 Docker 守护进程连接
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 修复点 2：将镜像正常构建并加载到本地 Docker 镜像库
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true # 关键：将镜像加载回本地 docker daemon
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      ##########################################################
      # Trivy SARIF Scan (用于 GitHub 安全标签页)
      ##########################################################

      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      ##########################################################
      # Generate JSON Report For Copa
      ##########################################################

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # Run Copa Patch (使用官方 Action 替代手动安装)
      ##########################################################

      # 修复点 3：直接使用 project-copacetic 官方提供的 Action
      # 它会自动管理 BuildKit 容器和套接字，完全避免权限和路径问题
      - name: Patch Image Using Copa
        uses: project-copacetic/copa-action@v1
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          image-report: trivy-report.json
          patched-tag: ${{ env.PATCHED_TAG }}
          copa-version: 0.8.0
          buildkit-version: v0.13.2

      ##########################################################
      # Verify Patched Image
      ##########################################################

      - name: Verify Patched Image
        run: |
          docker images
          docker inspect ${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}

      ##########################################################
      # Re-Scan Patched Image
      ##########################################################

      - name: Re-Scan Patched Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}'
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # Harbor Login & Push
      ##########################################################

      - name: Login Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push Patched Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }} \
            ${{ env.REGISTRY }}/public/webdev:${{ env.PATCHED_TAG }}
          docker push \
            ${{ env.REGISTRY }}/public/webdev:${{ env.PATCHED_TAG }}

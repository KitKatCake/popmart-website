name: Trivy Security Scan & Auto Repair

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  security-events: write
  packages: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: popmart-web
  IMAGE_TAG: latest
  PATCHED_TAG: latest-patched

jobs:
  trivy-scan-and-repair:
    name: Security Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      ##########################################################
      # Build Docker Image
      ##########################################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify image exists
        run: |
          docker images
          docker inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      ##########################################################
      # Snyk Scan (Application Layer Dependencies + SAST)
      ##########################################################

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk Dependency Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --all-projects --json-file-output=snyk-deps.json
        continue-on-error: true

      - name: Snyk Code Test (SAST)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high --json-file-output=snyk-code.json
        continue-on-error: true

      - name: Snyk Auto Fix & Commit
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "=== Attempting Snyk auto-fix ==="
          snyk fix --yes || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "=== Changes detected, committing fixes ==="
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: apply Snyk auto-fixes for npm vulnerabilities [skip ci]"
            git push
            echo "=== Fixes committed and pushed ==="
          else
            echo "=== No auto-fixable changes ==="
          fi
        continue-on-error: true

      - name: Snyk Monitor
        if: github.event_name != 'pull_request'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects
        continue-on-error: true

      ##########################################################
      # Trivy SARIF Scan
      ##########################################################

      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      ##########################################################
      # Generate JSON Report For Copa
      ##########################################################

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      - name: Verify Trivy Report
        run: |
          ls -lh trivy-report.json
          cat trivy-report.json | head -50

      ##########################################################
      # Install Copa
      ##########################################################

      - name: Install Copa CLI
        run: |
          COPA_VERSION="0.14.0"

          curl -L \
            -o /tmp/copa.tar.gz \
            https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}/copa_${COPA_VERSION}_linux_amd64.tar.gz

          tar -xzf /tmp/copa.tar.gz -C /tmp

          chmod +x /tmp/copa

          sudo mv /tmp/copa /usr/local/bin/copa

          

      ##########################################################
      # Verify Copa
      ##########################################################

      - name: Verify Copa Installation
        run: |
          which copa
          

      ##########################################################
      # Patch Image
      ##########################################################

      - name: Patch Image Locally
        run: |
          copa patch \
            -i ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -r trivy-report.json \
            -t ${{ env.PATCHED_TAG }} \
            --image-store local

      ##########################################################
      # Verify Patched Image
      ##########################################################

      - name: Verify Patched Image
        run: |
          docker images
          docker inspect ${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}

      ##########################################################
      # Re-Scan Patched Image
      ##########################################################

      - name: Re-Scan Patched Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}'
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # Harbor Login
      ##########################################################

      - name: Login Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      ##########################################################
      # Push Patched Image
      ##########################################################

      - name: Push Patched Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

name: Trivy Security Scan & Auto Repair

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  security-events: write
  packages: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: popmart-web
  IMAGE_TAG: latest
  PATCHED_TAG: latest-patched

jobs:
  trivy-scan-and-repair:
    name: Security Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      ##########################################################
      # 1. 启动并配置本地 Docker Buildx 环境
      ##########################################################
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 使用官方推荐的 Build Action，显式通过 `load: true` 将镜像导出到宿主机 Docker 守护进程
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true 
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      ##########################################################
      # 2. 运行 Trivy SARIF 扫描（用于 GitHub 安全漏洞面板展示）
      ##########################################################
      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      ##########################################################
      # 3. 运行 Trivy JSON 扫描（专供 Copa 读取的操作码报告）
      ##########################################################
      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # 4. 核心修复：使用 Copa 本地驱动修补镜像
      ##########################################################
      - name: Patch Image Using Copa
        uses: project-copacetic/copa-action@v1
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          image-report: trivy-report.json
          patched-tag: ${{ env.PATCHED_TAG }}
          copa-version: 0.8.0
          timeout: 5m
          # ✨ 已移除 buildkit-version，底层将自动匹配调用步骤 1 的 buildx 实例
          # ✨ 默认使用 openvex 格式，如需要可通过 format 参数微调

      ##########################################################
      # 5. 校验并二次扫描修补后的镜像（确认漏洞是否闭环）
      ##########################################################
      - name: Verify Patched Image
        run: |
          docker images
          docker inspect ${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}

      - name: Re-Scan Patched Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}'
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH

      ##########################################################
      # 6. 推送修补后的成品镜像至私有 Harbor 仓库
      ##########################################################
      - name: Login Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push Patched Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }} \
            ${{ env.REGISTRY }}/public/webdev:${{ env.PATCHED_TAG }}
          docker push \
            ${{ env.REGISTRY }}/public/webdev:${{ env.PATCHED_TAG }}
            

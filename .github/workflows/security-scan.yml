name: Trivy Security Scan & Auto Repair

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1' # 每周一自动扫描

permissions:
  contents: write
  security-events: write
  packages: write

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: popmart-web
  IMAGE_TAG: latest
  PATCHED_TAG: latest-patched

jobs:
  trivy-scan-and-repair:
    name: Security Workflow
    runs-on: ubuntu-latest
    steps:
      # ----------------------------
      # 1. Checkout source
      # ----------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ----------------------------
      # 2. 初始化并构建本地 Docker 镜像
      # ----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify image exists
        run: |
          docker images
          docker inspect ${IMAGE_NAME}:${IMAGE_TAG}

      # ----------------------------
      # 3. 运行 Trivy 漏洞扫描（SARIF + JSON）
      # ----------------------------
      - name: Run Trivy SARIF Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: json
          output: trivy-report.json
          vuln-type: os
          severity: CRITICAL,HIGH

      # ----------------------------
      # 4. 安装 Copa CLI（直接下载二进制）
      # ----------------------------
      - name: Install Copa CLI
        run: |
          COPA_VERSION="v0.8.0" # 替换为你需要的版本
          curl -L -o /usr/local/bin/copa https://github.com/project-copacetic/copacetic/releases/download/${COPA_VERSION}/copa-linux-amd64
          chmod +x /usr/local/bin/copa
          copa version

      # ----------------------------
      # 5. Patch 镜像
      # ----------------------------
      - name: Patch Image Locally
        run: |
          copa patch \
            -i ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -r trivy-report.json \
            -t ${{ env.PATCHED_TAG }} \
            --image-store local

      # ----------------------------
      # 6. 验证修补后的镜像
      # ----------------------------
      - name: Verify Patched Image
        run: |
          docker images
          docker inspect ${IMAGE_NAME}:${PATCHED_TAG}

      - name: Re-Scan Patched Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }}'
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH

      # ----------------------------
      # 7. 登录 Harbor 并推送修补镜像
      # ----------------------------
      - name: Login Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push Patched Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.PATCHED_TAG }} \
            ${{ env.REGISTRY }}/public/webdev:${{ env.PATCHED_TAG }}
          docker push \
            ${{ env.REGISTRY }}/public/webdev:${{ env.PATCHED_TAG }}

name: Docker Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: public/popmart-website
  CONTAINER_NAME: popmart-web
  ECS_HOST: ${{ secrets.ECS_HOST }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================================================
      # Snyk Dependency Scan (Build Gate)
      # 在构建前拦截应用层（npm）高危/严重漏洞
      # =========================================================
      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk Dependency Test (Build Gate)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --all-projects

      # =========================================================
      # PR 时：只构建，不登录，不推送（验证构建是否通过）
      # Push 到 main 时：登录 + 构建 + 推送
      # =========================================================
      - name: Log in to Harbor Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        if: github.event_name == 'push'
        run: echo "Image pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"

      # =========================================================
      # 步骤 5：远程部署到阿里云 ECS
      # 守卫：必须 push 事件 + ECS_HOST secret 已配置
      # =========================================================
      - name: Validate deploy secrets
        if: github.event_name == 'push'
        env:
          ECS_HOST: ${{ env.ECS_HOST }}
        run: |
          echo "ECS_HOST='${ECS_HOST}'"
          if [ -z "${ECS_HOST}" ]; then
            echo "::error::ECS_HOST secret is empty. Configure it in Settings → Secrets before deploy can run."
            exit 1
          fi
          echo "ECS_HOST is set, deploy will proceed."

      - name: Deploy to Alibaba Cloud ECS
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.ECS_HOST }}
          username: root
          password: ${{ secrets.ECS_SSH_PASSWORD }}
          port: 22
          envs: HARBOR_REGISTRY,HARBOR_USERNAME,HARBOR_PASSWORD
          command_timeout: 15m
          script: |
            set -euo pipefail
            IMAGE_FULL="${HARBOR_REGISTRY}/${{ env.IMAGE_NAME }}:dev"
            CONTAINER_NAME=${{ env.CONTAINER_NAME }}

            if [ -z "${HARBOR_PASSWORD:-}" ] || [ -z "${HARBOR_USERNAME:-}" ]; then
              echo "::error::HARBOR_USERNAME or HARBOR_PASSWORD secret is empty."
              exit 1
            fi

            echo "=== Docker login to Harbor ==="
            printf '%s' "${HARBOR_PASSWORD}" | docker login "${HARBOR_REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin

            echo "=== Pull latest :dev image ==="
            docker pull "${IMAGE_FULL}"

            echo "=== Stop and remove old container ==="
            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm   "${CONTAINER_NAME}" 2>/dev/null || true

            echo "=== Run new container (host:3000 -> container:3000) ==="
            docker run -d \
              --name "${CONTAINER_NAME}" \
              -p 3000:3000 \
              --restart always \
              "${IMAGE_FULL}"

            echo "=== Verify deployment ==="
            docker ps | grep "${CONTAINER_NAME}"
            echo "Deployment completed successfully!"
